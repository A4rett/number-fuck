<!doctype html><html lang="ku" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Number Finder V4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#06101c;color:#eef5ff;font-family:Arial,"Noto Sans",sans-serif}.bg{min-height:100vh;background:radial-gradient(circle at 20% 0,#16477a55,transparent 32%),radial-gradient(circle at 100% 20%,#5b2e8a44,transparent 30%);padding:28px 0}.wrap{width:min(980px,92%);margin:auto}.top{text-align:center;padding:28px 0}.pill{display:inline-block;border:1px solid #ffffff1c;background:#ffffff0b;padding:8px 14px;border-radius:99px;color:#8fc1ff;font-size:12px}.logo{font-size:46px;font-weight:900;margin:14px 0 5px;letter-spacing:-2px}.desc{color:#9eacc0}.panel{background:#ffffff0b;border:1px solid #ffffff16;border-radius:28px;padding:22px;box-shadow:0 25px 80px #0007;backdrop-filter:blur(20px)}.search{display:flex;gap:10px;background:#fff;padding:7px;border-radius:18px}.search input{flex:1;border:0;outline:0;padding:14px;font-size:18px;direction:ltr}.search button{border:0;border-radius:13px;background:#287cff;color:#fff;font-weight:800;font-size:16px;padding:0 27px;cursor:pointer}.status{text-align:center;color:#aebbd0;min-height:27px;padding:12px}.box{display:none}.headline{font-size:19px;font-weight:800;margin:10px 0 15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{border:1px solid #ffffff12;background:#ffffff08;border-radius:17px;padding:15px}.label{font-size:12px;color:#8495ad;margin-bottom:7px}.value{font-size:16px;font-weight:700;overflow-wrap:anywhere}.source{margin-top:18px;padding:13px 15px;border-radius:15px;background:#287cff12;color:#a8caff;font-size:13px}.social{margin-top:23px}.socialgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.social a{color:#fff;text-decoration:none;text-align:center;padding:14px;border:1px solid #ffffff12;background:#ffffff08;border-radius:15px;font-weight:700}.social a:hover{background:#ffffff14}.foot{text-align:center;color:#718198;font-size:12px;line-height:1.8;margin:18px 0}.err{color:#ff9d9d}.ok{color:#9be7bc}@media(max-width:700px){.logo{font-size:36px}.search{flex-direction:column}.search button{height:52px}.grid{grid-template-columns:repeat(2,1fr)}.socialgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="bg"><div class="wrap"><header class="top"><span class="pill">SMART PHONE INTELLIGENCE</span><div class="logo">NUMBER FINDER</div><div class="desc">گەڕان لە چەند سەرچاوەی داتا و سەرچاوە گشتییەکان</div></header>
<section class="panel"><div class="search"><input id="phone" inputmode="tel" placeholder="+964 750 123 4567"><button id="go">🔎 گەڕان</button></div><div id="status" class="status"></div><div id="box" class="box"><div class="headline">📋 ئەنجامەکان</div><div id="grid" class="grid"></div><div id="source" class="source"></div><div class="social"><div class="headline">🌐 گەڕانی گشتی</div><div id="socialgrid" class="socialgrid"></div></div></div><div class="foot">تەنها داتای گشتی و ڕێگەپێدراو نیشان دەدرێت. ئەم سایتە ناتوانێت بەشێوەیەکی شاراوە بۆ ئەکاونتی تایبەتی بچێت.</div></section></div></div>
<script>
const $=x=>document.getElementById(x), esc=s=>String(s??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function links(p){let q=encodeURIComponent(p);return[['✈️ Telegram','https://www.google.com/search?q='+encodeURIComponent('site:t.me '+p)],['👻 Snapchat','https://www.google.com/search?q='+encodeURIComponent('site:snapchat.com '+p)],['📸 Instagram','https://www.google.com/search?q='+encodeURIComponent('site:instagram.com '+p)],['📘 Facebook','https://www.google.com/search?q='+encodeURIComponent('site:facebook.com '+p)],['🎵 TikTok','https://www.google.com/search?q='+encodeURIComponent('site:tiktok.com '+p)],['🌐 Google','https://www.google.com/search?q='+q]]}
async function go(){let p=$('phone').value.trim();if(!p){$('status').textContent='تکایە ژمارەکە بنووسە';return}$('box').style.display='none';$('status').textContent='⏳ چاوەڕێ بکە...';try{let r=await fetch('/api/lookup?phone='+encodeURIComponent(p));let d=await r.json();if(!r.ok)throw Error(d.error||'هەڵەیەک ڕوویدا');let rows=[['👤 ناو',d.name],['🔤 Alias',d.alias],['🌍 وڵات',d.country],['📍 شوێنی گشتی',d.location],['📡 Carrier',d.carrier],['📞 جۆری هێڵ',d.line_type],['🚨 Spam',d.spam===true?'بەڵێ':d.spam===false?'نەخێر':'—'],['✓ Valid',d.valid===true?'بەڵێ':d.valid===false?'نەخێر':'—']];$('grid').innerHTML=rows.map(x=>`<div class=item><div class=label>${x[0]}</div><div class=value>${esc(x[1])}</div></div>`).join('');$('source').textContent='داتا: '+(d.sources||'سەرچاوەکانی بەردەست');$('socialgrid').innerHTML=links(p).map(x=>`<a target=_blank rel=noopener href="${x[1]}">${x[0]}</a>`).join('');$('box').style.display='block';$('status').textContent='✓ گەڕان تەواو بوو';$('status').className='status ok'}catch(e){$('status').textContent='❌ '+e.message;$('status').className='status err'}}
$('go').onclick=go;$('phone').addEventListener('keydown',e=>e.key==='Enter'&&go());
</script></body></html>
